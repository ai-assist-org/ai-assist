# LiteLLM proxy config for the sandbox's "litellm" feature. Maps model aliases
# ai-assist will use (AI_ASSIST_MODEL) to the real backend model + provider
# credentials. See ../../litellm-proxy/README.md at the repo root for the
# verified, standalone (non-sandboxed) version of this same setup.
model_list:
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
