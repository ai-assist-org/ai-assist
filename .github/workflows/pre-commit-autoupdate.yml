name: Pre-commit autoupdate

on:
  schedule:
    - cron: "37 8 * * 1"  # Monday 8:37 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Run autoupdate
        run: uv run pre-commit autoupdate --freeze

      - name: Run pre-commit with updated hooks
        run: uv run pre-commit run --all-files

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: deps/pre-commit-autoupdate
          title: "deps: update pre-commit hooks"
          body: |
            Automated pre-commit hook update via `pre-commit autoupdate --freeze`.

            Revs are pinned to commit SHAs for supply-chain security.
          commit-message: "deps: update pre-commit hooks"
          labels: dependencies
