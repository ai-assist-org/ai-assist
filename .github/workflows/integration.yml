name: Nightly integration

# Not a blocking gate: runs on a schedule until its runtime is known.
on:
  schedule:
    - cron: "23 3 * * *"  # Daily 3:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: redhat-community-ai-tools/dci-mcp-server
          path: dci-mcp-server

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"

      - name: Install podman-compose
        run: sudo apt-get update && sudo apt-get install -y podman-compose

      - name: Install dependencies
        run: uv sync --locked --extra dev --group dev

      - name: Build sandbox images
        run: make sandbox-build-dev DCI_MCP_SERVER_DIR=dci-mcp-server

      - name: Run integration tests with coverage
        run: >-
          uv run pytest tests/test_sandbox_integration.py -v -m integration
          --override-ini="addopts="
          --cov=ai_assist --cov-report=term --cov-report=xml:coverage-integration.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-integration
          path: coverage-integration.xml
          if-no-files-found: warn
