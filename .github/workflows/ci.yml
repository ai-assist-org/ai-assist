name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra eval --group dev

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  # The transform child confines itself with Seatbelt on macOS: run its tests on a real Mac, with a
  # uv-managed Python and with a framework build (Homebrew's or python.org's), whose launcher
  # re-spawns the interpreter at startup. The python.org installer is pinned by its SHA-256.
  macos-transform:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: [uv-managed, framework]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python == 'uv-managed' && '3.14' || '' }}

      - name: Install the python.org framework build
        if: matrix.python == 'framework'
        run: |
          curl -fsSLO https://www.python.org/ftp/python/3.14.10/python-3.14.10-macos11.pkg
          echo "286c7018aa2730f6747ca433dccdc2b31be45f078a9ea0ffa44d5f06368fd2d7  python-3.14.10-macos11.pkg" | shasum -a 256 -c
          sudo installer -pkg python-3.14.10-macos11.pkg -target /
          echo "UV_PYTHON=/Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --locked --extra dev --group dev

      - name: Run the transform tests
        run: uv run pytest tests/test_transform_tools.py tests/test_transform_security.py

  container-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - containerfile: sandbox/ai-assist/Dockerfile
            image: ai-assist-sandbox
            context: .
          - containerfile: sandbox/profiles/dev/Dockerfile
            image: ai-assist-sandbox-dev
            context: sandbox/profiles/dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build base image (for dev profile)
        if: matrix.image == 'ai-assist-sandbox-dev'
        run: docker build -t ai-assist-sandbox -f sandbox/ai-assist/Dockerfile .

      - name: Build container image (${{ matrix.containerfile }})
        run: docker build -t ${{ matrix.image }} -f ${{ matrix.containerfile }} ${{ matrix.context }}

      - name: Smoke-test container image
        if: matrix.image == 'ai-assist-sandbox'
        run: |
          docker run --rm ${{ matrix.image }} /help

      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"

      # agent-eval-harness is a git dependency pinned by commit: it has no PyPI
      # version for pip-audit to look up, so it is left out of the scan.
      - name: Export locked Python dependency set
        run: >-
          uv export --locked --all-extras --all-groups --no-hashes
          --no-emit-project --no-emit-package agent-eval-harness
          --format requirements-txt -o requirements-audit.txt

      - name: Audit Python dependencies for known vulnerabilities
        run: uvx pip-audit==2.10.1 --strict --disable-pip --no-deps -r requirements-audit.txt
